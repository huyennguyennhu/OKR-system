<div class="page-container d-flex justify-content-center">
  <div class="card create-form-card">
    <div class="card-header pb-0 border-0 pt-4 px-4">
      <h3 class="card-title fw-bold" style="color: var(--text-main); font-size: 16px;">Create Objective</h3>
      <hr class="mt-3 mb-0" />
    </div>
    
    <div class="card-body p-4">
      <div class="row mb-3">
        <div class="col-md-4 form-group">
          <label>Level</label>
          <div class="select-wrapper">
            <span class="icon-prefix text-primary"><i class="fa-solid fa-building"></i></span>
            <select class="form-select with-icon" [(ngModel)]="objective.level">
              <option value="COMPANY">COMPANY</option>
              <option value="TEAM">TEAM</option>
              <option value="PERSONAL">PERSONAL</option>
            </select>
          </div>
        </div>
        <div class="col-md-4 form-group">
          <label>Category</label>
          <select class="form-select" [(ngModel)]="objective.category">
            <option value="Objective">Objective</option>
            <option value="KPI">KPI</option>
          </select>
        </div>
        <div class="col-md-4 form-group">
          <label>Indicator</label>
          <select class="form-select text-muted" disabled>
            <option>None</option>
          </select>
        </div>
      </div>

      <div class="form-group mb-3">
        <label>Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="objective.title" />
      </div>

      <div class="form-group mb-4">
        <label>Description</label>
        <div class="rich-text-editor">
          <div class="toolbar">
            <button><i class="fa-solid fa-bold"></i></button>
            <button><i class="fa-solid fa-italic"></i></button>
            <button><i class="fa-solid fa-underline"></i></button>
            <div class="divider"></div>
            <button><i class="fa-solid fa-align-left"></i></button>
            <button><i class="fa-solid fa-align-center"></i></button>
            <button><i class="fa-solid fa-align-right"></i></button>
            <div class="divider"></div>
            <button><i class="fa-regular fa-file"></i></button>
            <button><i class="fa-regular fa-image"></i></button>
            <button><i class="fa-solid fa-video"></i></button>
          </div>
          <textarea class="form-control text-area" rows="4" placeholder="Insert text here..." [(ngModel)]="objective.description"></textarea>
          <div class="toolbar-footer text-muted">characters : 0 words : 0</div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-8 form-group">
          <label>Metric</label>
          <select class="form-select" [(ngModel)]="objective.metric_id">
            <option [ngValue]="null">Select Metric</option>
            <option *ngFor="let m of metrics" [value]="m.id">{{ m.name }} [System Metric]</option>
          </select>
        </div>
        <div class="col-md-4 form-group">
          <label>Aggregation Type <i class="fa-solid fa-info-circle text-muted"></i></label>
          <select class="form-select">
            <option>SUM</option>
            <option>AVERAGE</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4 form-group">
          <label>Group</label>
          <select class="form-select text-muted" disabled>
            <option>Select Group</option>
          </select>
        </div>
        <div class="col-md-4 form-group">
          <label>Team</label>
          <select class="form-select text-muted" disabled>
            <option>Select Team</option>
          </select>
        </div>
        <div class="col-md-4 form-group">
          <label>Assignee</label>
          <select class="form-select" [(ngModel)]="objective.assignee_id">
            <option [ngValue]="null" class="text-muted">Select User</option>
            <option *ngFor="let emp of employees" [value]="emp.employee_id">{{ emp.full_name }}</option>
          </select>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-8 form-group">
          <label>Timeline <span class="text-danger">*</span></label>
          <div class="input-group">
            <select class="form-select" [(ngModel)]="objective.timeline_id">
              <option [ngValue]="null">Select Timeline</option>
              <option *ngFor="let t of timelines" [value]="t.id">{{ t.title }}</option>
            </select>
          </div>
        </div>
        <div class="col-md-4 form-group">
          <label>Stakeholder</label>
          <select class="form-select text-muted" disabled>
            <option>Select User</option>
          </select>
        </div>
      </div>

      <div class="timeline-detail-box mb-4">
        <table class="table mb-0">
          <thead>
            <tr>
              <th class="bg-light text-muted">Timeline Detail</th>
              <th class="bg-light text-muted text-end" style="width: 100px;">Start</th>
              <th class="bg-light text-muted text-end" style="width: 100px;">Expected</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><i class="fa-solid fa-chevron-down me-2"></i> 2026</td>
              <td class="text-end">-</td>
              <td class="text-end">-</td>
            </tr>
            <tr>
              <td class="ps-4"><i class="fa-solid fa-chevron-down me-2"></i> Quarter 3</td>
              <td class="text-end">-</td>
              <td class="text-end">-</td>
            </tr>
            <tr>
              <td class="ps-5">Month 8</td>
              <td class="text-end">-</td>
              <td class="text-end">-</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end gap-3 mt-4 pt-2">
        <button class="btn btn-light bg-transparent border-0" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary px-4" (click)="saveObjective()" [disabled]="saving">Save</button>
      </div>

    </div>
  </div>
</div>
